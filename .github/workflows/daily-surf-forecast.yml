name: Surf forecast → Telegram (manuel)

# La commande « surf » tourne sur Vercel (voir app.py). Aucun envoi automatique :
# ce workflow ne sert que de secours, en déclenchement manuel.
on:
  workflow_dispatch: {}

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Envoyer le forecast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 2e essai 2 min plus tard si le 1er échoue (panne réseau ponctuelle)
        run: python -m surf_forecast || (sleep 120 && python -m surf_forecast)
